<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루틴보드</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html" style="color:inherit;"><span class="mark">R</span> 루틴보드</a>
    <nav class="site-nav">
      <a href="index.html">새 루틴보드 만들기</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" style="padding:40px 0 16px;">
    <div class="wrap">
      <h1 id="routineTitle">불러오는 중...</h1>
      <div class="share-box">
        이 링크를 공유하면 누구나 함께 확인하고 참여할 수 있습니다 —
        <code id="shareUrl">...</code>
        <button class="btn ghost" id="copyLinkBtn">링크 복사</button>
        <button class="btn ghost" id="exportBtn">전체 현황 마크다운으로 복사</button>
      </div>
    </div>
  </section>

  <!-- 상태보고서 -->
  <section style="padding-top:0;">
    <div class="wrap">
      <div class="card">
        <div class="section-header">
          <h2>상태보고서</h2>
          <span class="section-count" id="reportCount"></span>
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="reportDate">보고서 날짜</label>
            <input type="date" id="reportDate">
          </div>
          <div class="field">
            <label for="health">상태 신호등</label>
            <select id="health">
              <option value="good">정상</option>
              <option value="warning">주의</option>
              <option value="risk">위험</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="progressSummary">이번 주 진행 요약</label>
          <textarea id="progressSummary" placeholder="이번 주 진행 상황을 요약해주세요"></textarea>
        </div>
        <div class="field">
          <label for="risksIssues">이슈·리스크</label>
          <textarea id="risksIssues" placeholder="현재 이슈나 리스크가 있다면 적어주세요"></textarea>
        </div>
        <div class="field">
          <label for="nextWeekPlan">다음 주 계획</label>
          <textarea id="nextWeekPlan" placeholder="다음 주에 진행할 계획을 적어주세요"></textarea>
        </div>
        <button class="btn" id="reportAddBtn">등록</button>
        <div id="reportList" style="margin-top:18px;"></div>
      </div>
    </div>
  </section>

  <!-- 워크로드 -->
  <section style="padding-top:0;">
    <div class="wrap">
      <div class="card">
        <div class="section-header">
          <h2>워크로드</h2>
          <span class="section-count" id="taskCount"></span>
        </div>
        <div class="field-row">
          <div class="field" style="margin-bottom:0;">
            <label for="taskTitle">업무</label>
            <input type="text" id="taskTitle" placeholder="예: 결제 모듈 QA">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="taskOwner">담당자</label>
            <input type="text" id="taskOwner" placeholder="예: 김민지">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="taskDue">마감일</label>
            <input type="date" id="taskDue">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="taskMemo">메모</label>
            <input type="text" id="taskMemo" placeholder="선택">
          </div>
          <button class="btn" id="taskAddBtn">추가</button>
        </div>
        <div id="taskList" style="margin-top:18px;"></div>
      </div>
    </div>
  </section>

  <!-- 리스크매트릭스 -->
  <section style="padding-top:0;">
    <div class="wrap">
      <div class="card">
        <div class="section-header">
          <h2>리스크매트릭스</h2>
          <span class="section-count" id="riskCount"></span>
        </div>
        <div class="field-row4">
          <div class="field" style="margin-bottom:0;">
            <label for="riskTitle">리스크</label>
            <input type="text" id="riskTitle" placeholder="예: 핵심 개발자가 다음 달 퇴사 예정">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="riskProbability">확률</label>
            <select id="riskProbability">
              <option value="low">낮음</option>
              <option value="medium" selected>보통</option>
              <option value="high">높음</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="riskImpact">영향</label>
            <select id="riskImpact">
              <option value="low">낮음</option>
              <option value="medium" selected>보통</option>
              <option value="high">높음</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="riskOwner">담당자</label>
            <input type="text" id="riskOwner" placeholder="선택">
          </div>
          <button class="btn" id="riskAddBtn">등록</button>
        </div>
        <div class="field" style="margin-top:-4px;">
          <label for="riskMitigation">대응 계획 (선택)</label>
          <textarea id="riskMitigation" placeholder="예: 발생 시 백업 인력 즉시 투입, 인수인계 문서 사전 작성"></textarea>
        </div>
        <div id="riskList" style="margin-top:8px;"></div>
      </div>
    </div>
  </section>

  <!-- 회고 -->
  <section style="padding-top:0;">
    <div class="wrap">
      <div class="section-header" style="margin-bottom:12px;">
        <h2>회고</h2>
      </div>
      <div class="retro-columns">

        <div class="card retro-column" data-category="good">
          <div class="retro-column-head">
            <h3>👍 잘한 점</h3>
            <span class="retro-column-count" id="count-good">0</span>
          </div>
          <div class="retro-list" id="list-good"></div>
          <div class="retro-add-form">
            <input type="text" class="author-input" placeholder="익명으로 남기려면 비워두세요" data-category="good" data-role="author">
            <textarea placeholder="잘한 점을 적어주세요" data-category="good" data-role="content"></textarea>
            <button class="btn small block" data-action="retro-add" data-category="good">추가</button>
          </div>
        </div>

        <div class="card retro-column" data-category="improve">
          <div class="retro-column-head">
            <h3>🤔 아쉬운 점</h3>
            <span class="retro-column-count" id="count-improve">0</span>
          </div>
          <div class="retro-list" id="list-improve"></div>
          <div class="retro-add-form">
            <input type="text" class="author-input" placeholder="익명으로 남기려면 비워두세요" data-category="improve" data-role="author">
            <textarea placeholder="아쉬운 점을 적어주세요" data-category="improve" data-role="content"></textarea>
            <button class="btn small block" data-action="retro-add" data-category="improve">추가</button>
          </div>
        </div>

        <div class="card retro-column" data-category="action">
          <div class="retro-column-head">
            <h3>➡ 다음 액션</h3>
            <span class="retro-column-count" id="count-action">0</span>
          </div>
          <div class="retro-list" id="list-action"></div>
          <div class="retro-add-form">
            <input type="text" class="author-input" placeholder="익명으로 남기려면 비워두세요" data-category="action" data-role="author">
            <textarea placeholder="다음에 할 액션을 적어주세요" data-category="action" data-role="content"></textarea>
            <button class="btn small block" data-action="retro-add" data-category="action">추가</button>
          </div>
        </div>

      </div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <div>&copy; 2026 루틴보드 — <a href="index.html">새 루틴보드 만들기</a></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("r");
  const routineTitleEl = document.getElementById("routineTitle");
  const shareUrlEl = document.getElementById("shareUrl");
  const reportDateInput = document.getElementById("reportDate");
  const retroCategories = ["good", "improve", "action"];

  let currentRoutine = null;
  let currentReports = [];
  let currentTasks = [];
  let currentRisks = [];
  let currentRetroItems = [];

  reportDateInput.value = new Date().toISOString().slice(0, 10);

  /* ---------- 상태보고서 ---------- */
  function bodyOrEmpty(text) {
    return text ? escapeHtml(text) : `<span class="empty-state" style="padding:0;">작성된 내용이 없습니다.</span>`;
  }

  function renderReports() {
    const listEl = document.getElementById("reportList");
    document.getElementById("reportCount").textContent = currentReports.length ? `${currentReports.length}건` : "";
    if (currentReports.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 보고서가 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = "";
    currentReports.forEach((r) => {
      const row = document.createElement("div");
      row.className = "report-card";
      row.innerHTML = `
        <div class="report-card-head">
          <div class="report-date">${escapeHtml(r.report_date)}</div>
          <span class="status-pill status-${escapeHtml(r.health)}">${healthLabel(r.health)}</span>
          <button class="btn danger-text" data-id="${r.id}" data-action="report-delete" style="margin-left:auto;">삭제</button>
        </div>
        <div class="report-section">
          <div class="label-sm">이번 주 진행 요약</div>
          <div class="body-text">${bodyOrEmpty(r.progress_summary)}</div>
        </div>
        <div class="report-section">
          <div class="label-sm">이슈·리스크</div>
          <div class="body-text">${bodyOrEmpty(r.risks_issues)}</div>
        </div>
        <div class="report-section">
          <div class="label-sm">다음 주 계획</div>
          <div class="body-text">${bodyOrEmpty(r.next_week_plan)}</div>
        </div>
      `;
      listEl.appendChild(row);
    });
  }

  async function refreshReports() {
    currentReports = await loadReports(currentRoutine.id);
    renderReports();
  }

  /* ---------- 워크로드 ---------- */
  function renderTasks() {
    const listEl = document.getElementById("taskList");
    document.getElementById("taskCount").textContent = currentTasks.length ? `${currentTasks.length}건` : "";
    if (currentTasks.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 업무가 없습니다.</div>`;
      return;
    }
    const groups = groupByOwner(currentTasks);
    listEl.innerHTML = "";
    groups.forEach((g) => {
      const groupEl = document.createElement("div");
      groupEl.className = "owner-group";
      const badgeClass = g.activeCount > 0 ? "workload-badge" : "workload-badge zero";
      let rowsHtml = "";
      g.tasks.forEach((t) => {
        const due = t.due_date ? `<span class="item-meta">${escapeHtml(t.due_date)}</span>` : `<span class="item-meta"></span>`;
        rowsHtml += `
          <div class="item-row">
            <div class="item-task">${escapeHtml(t.title)}${t.memo ? `<span class="memo">${escapeHtml(t.memo)}</span>` : ""}</div>
            ${due}
            <button class="status-pill status-${t.status}" data-id="${t.id}" data-action="task-cycle">${taskStatusLabel(t.status)}</button>
            <button class="btn danger-text" data-id="${t.id}" data-action="task-delete">삭제</button>
          </div>
        `;
      });
      groupEl.innerHTML = `
        <div class="owner-head">
          <span class="name">${escapeHtml(g.owner_name)}</span>
          <span class="${badgeClass}">진행중 ${g.activeCount}건</span>
        </div>
        ${rowsHtml}
      `;
      listEl.appendChild(groupEl);
    });
  }

  async function refreshTasks() {
    currentTasks = await loadTasks(currentRoutine.id);
    renderTasks();
  }

  /* ---------- 리스크매트릭스 ---------- */
  function renderRisks() {
    const listEl = document.getElementById("riskList");
    document.getElementById("riskCount").textContent = currentRisks.length ? `${currentRisks.length}건` : "";
    if (currentRisks.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 리스크가 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = "";
    currentRisks.forEach((it) => {
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = `
        <span class="severity-tag ${riskLevelClass(it.probability, it.impact)}">${riskLevel(it.probability, it.impact)}</span>
        <div class="item-task">
          ${escapeHtml(it.title)}
          <span class="memo">확률: ${probabilityLabel(it.probability)} · 영향: ${impactLabel(it.impact)}</span>
          ${it.mitigation_plan ? `<span class="mitigation">대응 계획: ${escapeHtml(it.mitigation_plan)}</span>` : ""}
        </div>
        <div class="item-meta">${it.owner ? escapeHtml(it.owner) : ""}</div>
        <button class="status-pill status-${it.status}" data-id="${it.id}" data-action="risk-cycle">${riskStatusLabel(it.status)}</button>
        <button class="btn danger-text" data-id="${it.id}" data-action="risk-delete">삭제</button>
      `;
      listEl.appendChild(row);
    });
  }

  async function refreshRisks() {
    currentRisks = await loadRisks(currentRoutine.id);
    renderRisks();
  }

  /* ---------- 회고 ---------- */
  function renderRetroColumn(category) {
    const listEl = document.getElementById(`list-${category}`);
    const countEl = document.getElementById(`count-${category}`);
    const items = itemsByCategory(currentRetroItems, category);
    countEl.textContent = items.length;
    if (items.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 남긴 내용이 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = items.map((i) => `
      <div class="retro-item">
        <div class="retro-item-head">
          <div>
            <span class="author">${escapeHtml(i.author_name)}</span>
            <div class="content">${escapeHtml(i.content)}</div>
          </div>
          <button class="del-btn" data-action="retro-delete" data-id="${i.id}" title="삭제">×</button>
        </div>
      </div>
    `).join("");
  }

  function renderRetro() {
    retroCategories.forEach(renderRetroColumn);
  }

  async function refreshRetroItems() {
    currentRetroItems = await loadRetroItems(currentRoutine.id);
    renderRetro();
  }

  /* ---------- 초기화 ---------- */
  async function init() {
    if (!code) {
      routineTitleEl.textContent = "루틴보드를 찾을 수 없습니다";
      return;
    }
    try {
      currentRoutine = await loadRoutineByCode(code);
      routineTitleEl.textContent = currentRoutine.title;
      shareUrlEl.textContent = window.location.href;
      await Promise.all([refreshReports(), refreshTasks(), refreshRisks(), refreshRetroItems()]);
    } catch (e) {
      routineTitleEl.textContent = "불러오지 못했습니다";
      document.getElementById("reportList").innerHTML = `<div class="empty-state">루틴보드 정보를 불러오지 못했습니다. config.js 설정과 Supabase 스키마를 확인해주세요.</div>`;
    }
  }

  /* ---------- 이벤트: 상태보고서 ---------- */
  document.getElementById("reportAddBtn").addEventListener("click", async () => {
    if (!currentRoutine) return;
    const report_date = reportDateInput.value || new Date().toISOString().slice(0, 10);
    const health = document.getElementById("health").value;
    const progress_summary = document.getElementById("progressSummary").value.trim();
    const risks_issues = document.getElementById("risksIssues").value.trim();
    const next_week_plan = document.getElementById("nextWeekPlan").value.trim();
    await addReport(currentRoutine.id, { report_date, health, progress_summary, risks_issues, next_week_plan });
    document.getElementById("progressSummary").value = "";
    document.getElementById("risksIssues").value = "";
    document.getElementById("nextWeekPlan").value = "";
    document.getElementById("health").value = "good";
    reportDateInput.value = new Date().toISOString().slice(0, 10);
    await refreshReports();
  });

  document.getElementById("reportList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action='report-delete']");
    if (!btn) return;
    if (!confirm("이 보고서를 삭제할까요?")) return;
    await deleteReport(btn.getAttribute("data-id"));
    await refreshReports();
  });

  /* ---------- 이벤트: 워크로드 ---------- */
  document.getElementById("taskAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("taskTitle").value.trim();
    const ownerName = document.getElementById("taskOwner").value.trim();
    const dueDate = document.getElementById("taskDue").value;
    const memo = document.getElementById("taskMemo").value.trim();
    if (!title || !ownerName || !currentRoutine) return;
    await addTask(currentRoutine.id, { title, owner_name: ownerName, due_date: dueDate, memo });
    document.getElementById("taskTitle").value = "";
    document.getElementById("taskOwner").value = "";
    document.getElementById("taskDue").value = "";
    document.getElementById("taskMemo").value = "";
    await refreshTasks();
  });

  document.getElementById("taskList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    if (action === "task-cycle") {
      const item = currentTasks.find((i) => i.id === id);
      await updateTaskStatus(id, nextTaskStatus(item.status));
      await refreshTasks();
    } else if (action === "task-delete") {
      if (!confirm("이 업무를 삭제할까요?")) return;
      await deleteTask(id);
      await refreshTasks();
    }
  });

  /* ---------- 이벤트: 리스크매트릭스 ---------- */
  document.getElementById("riskAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("riskTitle").value.trim();
    const probability = document.getElementById("riskProbability").value;
    const impact = document.getElementById("riskImpact").value;
    const owner = document.getElementById("riskOwner").value.trim();
    const mitigation_plan = document.getElementById("riskMitigation").value.trim();
    if (!title || !currentRoutine) return;
    await addRisk(currentRoutine.id, { title, probability, impact, owner, mitigation_plan });
    document.getElementById("riskTitle").value = "";
    document.getElementById("riskOwner").value = "";
    document.getElementById("riskMitigation").value = "";
    document.getElementById("riskProbability").value = "medium";
    document.getElementById("riskImpact").value = "medium";
    await refreshRisks();
  });

  document.getElementById("riskList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    if (action === "risk-cycle") {
      const item = currentRisks.find((i) => i.id === id);
      await updateRiskStatus(id, nextRiskStatus(item.status));
      await refreshRisks();
    } else if (action === "risk-delete") {
      if (!confirm("이 리스크를 삭제할까요?")) return;
      await deleteRisk(id);
      await refreshRisks();
    }
  });

  /* ---------- 이벤트: 회고 ---------- */
  document.querySelectorAll("button[data-action='retro-add']").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const category = btn.getAttribute("data-category");
      const authorInput = document.querySelector(`input[data-category="${category}"][data-role="author"]`);
      const contentInput = document.querySelector(`textarea[data-category="${category}"][data-role="content"]`);
      const content = contentInput.value.trim();
      if (!content || !currentRoutine) return;
      const author_name = authorInput.value.trim();
      await addRetroItem(currentRoutine.id, { category, content, author_name });
      authorInput.value = "";
      contentInput.value = "";
      await refreshRetroItems();
    });
  });

  document.querySelectorAll(".retro-list").forEach((listEl) => {
    listEl.addEventListener("click", async (e) => {
      const delBtn = e.target.closest("button[data-action='retro-delete']");
      if (!delBtn) return;
      if (!confirm("이 항목을 삭제할까요?")) return;
      await deleteRetroItem(delBtn.getAttribute("data-id"));
      await refreshRetroItems();
    });
  });

  /* ---------- 공유 / 내보내기 ---------- */
  document.getElementById("copyLinkBtn").addEventListener("click", async () => {
    const ok = await copyText(window.location.href);
    const btn = document.getElementById("copyLinkBtn");
    btn.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(() => { btn.textContent = "링크 복사"; }, 1500);
  });

  document.getElementById("exportBtn").addEventListener("click", async () => {
    const md = exportMarkdown(currentRoutine, currentReports, currentTasks, currentRisks, currentRetroItems);
    const ok = await copyText(md);
    const btn = document.getElementById("exportBtn");
    btn.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(() => { btn.textContent = "전체 현황 마크다운으로 복사"; }, 1500);
  });

  init();
</script>
</body>
</html>
